name: iOS port
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', 'src/eq.rs', 'src/limiter.rs', 'src/link.rs', 'rust-toolchain.toml', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'src/eq.rs', 'src/limiter.rs', 'src/link.rs', 'rust-toolchain.toml', '.github/workflows/ios.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    name: Portable Swift tests
    runs-on: ubuntu-latest
    container: swift:6.4.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash ios/scripts/test-portable.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-tests-${{ github.sha }}
          path: ios/build/portable-tests.xml
          if-no-files-found: warn
          retention-days: 14
  rust:
    name: Rust tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios/Rust/target
          key: ios-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'ios/Rust/Cargo.lock') }}
      - name: Check the isolated core and unchanged shared sources
        run: |
          cargo fmt --manifest-path ios/Rust/Cargo.toml -- --check
          cargo clippy --locked --manifest-path ios/Rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path ios/Rust/Cargo.toml
          node ios/scripts/generate-project.mjs --check
          python3 ios/scripts/check-dependencies.py
          python3 .github/scripts/check-review-evidence.py
  apple:
    name: iOS ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [simulator, device]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: apple-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios/Rust/target
          key: ios-apple-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'ios/Rust/Cargo.lock') }}
      - name: Install official Rust targets and fetch pinned dependencies
        run: bash ios/scripts/bootstrap-macos.sh
      - name: Compile the app and run native simulator tests
        env:
          IOS_CI_TARGET: ${{ matrix.target }}
        run: bash ios/scripts/ci-macos.sh
      - name: Save build logs, XCTest results and unsigned app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.target }}-${{ github.sha }}
          path: |
            ios/build/logs
            ios/build/*.xcresult
            ios/build/artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Keep compiled Rust dependencies after an Apple build failure
        if: failure() && steps.apple-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios/Rust/target
          key: ios-apple-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'ios/Rust/Cargo.lock') }}
